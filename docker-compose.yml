services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready 会直接连接数据库，只有数据库可接受连接后 API 才启动。
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://expense:expense@db:5432/expense_tracker
      SECRET_KEY: change-this-secret-key-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 通过应用的健康检查接口确认 API 已完成启动。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
